[project]
name = "sas-e1"
version = "0.1.0"
description = "SAS Experiment 1 — representation complexity study for steering operators"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "huggingface_hub>=0.22",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "sentence-transformers>=2.7",
    "openai>=1.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]