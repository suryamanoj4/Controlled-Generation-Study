# SAS-E1b — Indic replication (Hindi + Telugu), authentic author corpora.
# Mirrors the English author-style design: same ladder logic, same steering families,
# same probes; the confirmatory question per language is H(story) > H(sentiment).
#
# Sources (verified 2026-10-15):
#   hi sentiment : iam-tsr/hindi-sentiments (MIT, ungated)
#   te sentiment : mounikaiiith/Telugu_Sentiment (CC-BY-4.0, ungated)
#   hi stories   : Wikisource — Premchand vs Jaishankar Prasad (public domain)
#   te stories   : Wikisource — Gurajada Apparao vs Kandukuri Veeresalingam (public domain)
run_name: indic
seed: 0

paths:
  data_raw: data/raw
  data_processed: data/processed
  activations: data/activations
  artifacts: artifacts
  models: models

model:
  name: bigscience/bloomz-1b7
  dtype: float16
  device: auto
  layer: null
  layer_fraction: 0.5

steering:
  ridge: 1.0e-3
  sv_clip: 10.0
  ranks: [1, 4, 16]
  include_full_rank: true
  n_fit_docs: 200
  n_stat_docs: 600
  resamples: [0, 1]
  trained:
    ranks: [1, 4]
    seeds: [0, 1]
    steps: 300
    batch_size: 128
    lr: 0.001
    lambda_cov: 1.0
    standardize: false

calibration:
  multipliers: [0.5, 1.0, 2.0, 4.0]

attributes:
  sentiment_hi:
    level: L1
    kind: sentiment
    positive: hindi_sent_positive
    contrast: hindi_sent_negative
    language: hi
    classifier_model: xlm-roberta-base
  story_hi:
    level: L3
    kind: style
    positive: wikisource_premchand
    contrast: wikisource_prasad
    language: hi
  sentiment_te:
    level: L1
    kind: sentiment
    positive: telugu_sent_positive
    contrast: telugu_sent_negative
    language: te
    classifier_model: xlm-roberta-base
  story_te:
    level: L3
    kind: style
    positive: wikisource_gurajada
    contrast: wikisource_veeresalingam
    language: te

generation:
  prompts_per_attr: 40
  max_new_tokens: 128
  temperature: 1.0
  top_p: 0.95
  batch_size: 8
  seeds: [0, 1]
  arms: [A, F1, F4, F16, Ffull, C1, C4, E, R, P]

matching:
  target_tokens: null
  max_len_percentile: 90
  min_tokens: 4

probes:
  n_neutral: 400
  separation: true
  stability: true

evaluation:
  classifier:
    embedding_model: distilbert-base-uncased   # unused for Indic sentiment (per-attr override)
    max_length: 256
    n_clf_train: 800
    n_clf_eval: 400
  ppl_model: null
  judge:
    enabled: false
    model: gpt-4o-mini

download:
  n_wikipedia: 500
  n_wikipedia_neutral: 400
  n_indic_sent: 12000
  gutenberg_sleep: 0.5
  wikisource_sleep: 1.0
