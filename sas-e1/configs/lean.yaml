# SAS-E1 Lean config — see design doc v1.4 §2.2 / §4.1–§4.1b.
#
# Single config for the full E1 experiment: English ladder (L1/L2/L3) **plus** the
# Indic replication attributes (Hindi primary, Telugu secondary). Setup downloads
# every corpus referenced here; the run covers all attributes.
#   Restrict:  --attr sentiment,toxicity,shakespeare,fable,sentiment_hi,story_hi,sentiment_te,story_te
run_name: lean
seed: 0

paths:
  data_raw: data/raw
  data_processed: data/processed
  activations: data/activations
  artifacts: artifacts
  models: models

model:
  name: bigscience/bloomz-1b7
  dtype: auto                 # auto = bf16 if the GPU supports it, else fp32
                              # (avoid fp16: BLOOM fp16 overflows to inf/NaN on some GPUs)
  device: auto              # auto | cuda | cpu
  layer: null               # null -> use layer_fraction
  layer_fraction: 0.5       # 50% depth (layer 12 of 24 for BLOOM)

steering:
  ridge: 1.0e-3             # covariance ridge for closed-form operator
  sv_clip: 10.0             # clip singular values of the moment map
  ranks: [1, 4, 16]         # closed-form rank truncations (arm F_r)
  include_full_rank: true   # arm Ffull
  n_fit_docs: 300           # per side, used for fitting (adapters need hundreds, not thousands)
  n_stat_docs: 1000         # per side, used for moment statistics
  resamples: [0, 1]         # closed-form resamples (bootstrap of stat docs)
  trained:
    ranks: [1, 4]           # arms C1, C4
    seeds: [0, 1]
    steps: 300
    batch_size: 128
    lr: 0.001
    lambda_cov: 1.0
    standardize: false

calibration:
  multipliers: [0.5, 1.0, 2.0, 4.0]   # m; alpha = m * alpha_unit (effect-norm calibrated)

attributes:
  # ---------------------------------------------------------- English ladder
  sentiment:
    level: L1
    kind: sentiment
    positive: sst2_positive
    contrast: sst2_negative
  toxicity:
    level: L2
    kind: toxicity
    positive: civil_toxic
    contrast: civil_benign
  shakespeare:
    level: L3
    kind: style
    positive: shakespeare
    contrast: early_modern_drama
  fable:
    level: L3
    kind: style
    positive: moral_stories
    contrast: wikipedia
  # ------------------------------------------- Indic replication (hi + te)
  sentiment_hi:
    level: L1
    kind: sentiment
    positive: hindi_sent_positive
    contrast: hindi_sent_negative
    language: hi
    classifier_model: xlm-roberta-base
    n_stat_docs: 400
    n_fit_docs: 150
    n_clf_train: 400
    n_clf_eval: 250
  story_hi:
    level: L3
    kind: style
    positive: wikisource_premchand
    contrast: wikisource_prasad
    language: hi
    # uniform L3 author budget: 200 docs/author (pool 130 + 45/25 classifier)
    n_pool_docs: 130
    n_stat_docs: 120
    n_fit_docs: 100
    n_clf_train: 45
    n_clf_eval: 25
  sentiment_te:
    level: L1
    kind: sentiment
    positive: telugu_sent_positive
    contrast: telugu_sent_negative
    language: te
    classifier_model: xlm-roberta-base
    n_stat_docs: 400
    n_fit_docs: 150
    n_clf_train: 400
    n_clf_eval: 250
  story_te:
    level: L3
    kind: style
    positive: wikisource_gurajada
    contrast: wikisource_veeresalingam
    language: te
    # uniform L3 author budget: 200 docs/author (pool 130 + 45/25 classifier)
    n_pool_docs: 130
    n_stat_docs: 120
    n_fit_docs: 100
    n_clf_train: 45
    n_clf_eval: 25

generation:
  prompts_per_attr: 40
  max_new_tokens: 128
  temperature: 1.0
  top_p: 0.95
  batch_size: 8             # lower to 4 if you hit OOM on an 11 GB card
  seeds: [0, 1]
  arms: [A, F1, F4, F16, Ffull, C1, C4, E, R, P]

matching:
  target_tokens: null       # null -> equalize to min(total pos, total neg)
  max_len_percentile: 90    # drop docs longer than this percentile (both sides)
  min_tokens: 4             # sentence-level corpora need a low floor (SST-2)

probes:
  n_neutral: 500
  separation: true
  stability: true

evaluation:
  classifier:
    embedding_model: distilbert-base-uncased   # unused for Indic sentiment (per-attribute override)
    max_length: 256
    n_clf_train: 800
    n_clf_eval: 400
  ppl_model: null           # null -> same as steering model
  judge:
    enabled: false
    model: gpt-4o-mini

download:
  n_sst_fit: 3000           # per class, steering pool (stat + fit + matching buffer)
  n_sst_clf: 900            # per class, classifier train (disjoint; split need = 4200/class)
  n_sst_eval: 450           # per class, classifier eval / S_human (disjoint)
  n_civil: 4500             # per class pool (split need = 4200/class)
  n_wikipedia: 4500         # contrast pool (fable contrast; split need = 4200/side)
  n_wikipedia_neutral: 500  # held-out neutral probe corpus
  n_moral: 4500             # fable positive pool (split need = 4200/side)
  n_indic_sent: 2200        # per class, Hindi/Telugu sentiment pools (split need = 1850/class)
  gutenberg_sleep: 0.5      # seconds between Gutendex calls
  wikisource_sleep: 1.0     # seconds between Wikisource API calls (politeness)
